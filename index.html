<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Claude/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Piano Flow — akan notalara dokunarak piyano çalma oyunu">

  <!--
    Without this a phone lays the page out at a notional 980 pixels and then
    shrinks the result to fit, so the whole game is drawn at the wrong size and
    every touch arrives in that scaled space. It was missing.

    Deliberately NOT viewport-fit=cover: left alone, iOS keeps the page inside
    the safe area, and this game puts its hit line low on the screen. Filling
    the whole display would slide that line under the home indicator, where a
    swipe leaves the app instead of playing a note.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- Added to the home screen, it runs as its own app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Piano Flow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    Which build this page is. Stamped in by tool/deploy.sh; the script at the
    bottom uses it to notice when the phone is running an old one.
  -->
  <meta name="piano-flow-build" content="63">

  <title>Piano Flow</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The app's own background, so neither the wait before the engine starts
       nor the safe-area bars on a notched phone flash white. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0B0B14;
      overscroll-behavior: none; /* no rubber-banding, no pull-to-refresh */
    }

    /* A game is played with the fingers, and a browser assumes fingers mean
       something else: a double tap zooms, a long press selects text and opens
       a callout, two fingers pinch. All of that fires in the middle of a
       piece. `manipulation` is the narrow one — it stops the double-tap zoom
       and the delay that comes with waiting to see if a tap was one, and
       leaves ordinary scrolling alone so the song list still works. */
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <script>
    // Undo the offline cache this app used to install.
    //
    // Earlier builds registered a service worker, and a registered worker keeps
    // serving its own cached copy — so a phone that opened the game once would
    // go on playing that version however many times the page was reloaded, and
    // every fix after it was invisible. Builds no longer register one; this
    // clears out any that is still installed from before.
    //
    // Adding the game to the home screen does NOT need one. It costs offline
    // play, which this has never had, and buys back being able to ship a fix.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
      });
    }

    // Notice when this phone is running an old build, and fetch the new one.
    //
    // Added to the home screen, the game is a page the phone keeps a copy of.
    // Unregistering the old service worker stopped the worst of that, but an
    // ordinary HTTP cache is enough on its own to go on serving a build for
    // hours — long enough for the player to test a fix that never arrived and
    // report it as not working, which happened.
    //
    // So: ask the server what the current build is, with caching turned off,
    // and if it is not this one, load the page again under a URL that has
    // never been cached. Once per version, so a stale copy that refuses to go
    // cannot put the app in a reload loop.
    (function () {
      var stamp = document.querySelector('meta[name="piano-flow-build"]');
      var mine = stamp ? stamp.content : '';
      if (!mine || mine === 'BUILD' + '_STAMP') return; // a local build
      fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (response) { return response.json(); })
        .then(function (server) {
          if (!server.version || server.version === mine) return;
          if (sessionStorage.getItem('pf-seen') === server.version) return;
          sessionStorage.setItem('pf-seen', server.version);
          location.replace(location.pathname + '?v=' + server.version);
        })
        .catch(function () {});
    })();

    // Safari honours `user-scalable=no` unevenly, so pinch-to-zoom is turned
    // away here as well. Without it a second finger — which this game asks
    // for by design, one hand each side — can zoom the board mid-song.
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
      document.addEventListener(name, function (event) {
        event.preventDefault();
      }, { passive: false });
    });
  </script>
  <script src="flutter_bootstrap.js?v=63" async></script>
</body>
</html>
